name: .NET

on:
  push:
    branches: 
      - main
      - feature/*
  pull_request:
    branches: 
      - main
      - feature/*

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Pin SDK to 10.0
      # ubuntu-latest ships a preview .NET 11 SDK, which would otherwise be picked over 10.0
      run: |
        cat > global.json <<'EOF'
        { "sdk": { "version": "10.0.100", "rollForward": "latestFeature", "allowPrerelease": false } }
        EOF
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
