<div class="componentCube" [class.armed]="hasArmedOutput">

    <!-- Left Side Buttons -->
    <div class="left-buttons">
      <button
        class="input-button"
        *ngFor="let input of Rule?.inputs"
        [attr.data-type]="input.type"
        [matTooltip]="TypeName(input.type) + ' input'"
        matTooltipPosition="left"
        (click)="DestinationClick(input.id)"
        mat-raised-button
        #buttonRef
        color="primary">
        {{ inputMapping[input.type]}}{{input.index}}
      </button>
    </div>

    <!-- Center Content -->
    <div class="center-content">
      <span class="component-kind">{{Kind}}</span>
      <div class="component-text" [matTooltip]="Rule?.description ?? ''">{{Rule?.description}}</div>
      <span class="external-badge"
            *ngIf="ExternalConnections > 0"
            matTooltip="Connections to blocks on another level, they are not drawn here">
        <mat-icon>alt_route</mat-icon>
        <span>{{ExternalConnections}} outside</span>
      </span>
    </div>

    <!-- Right Side Buttons -->
    <div class="right-buttons">
      <button
        class="output-button"
        *ngFor="let output of Rule?.outputs"
        [class.armed]="IsArmed(output.id)"
        matTooltip="Output - click it, then click an input"
        matTooltipPosition="right"
        (click)="SourceClick(output.id)"
        mat-raised-button
        #outputRef
        color="primary">
        O{{output.index}}
      </button>
    </div>

    <!-- Bottom Buttons -->
    <div class="bottom-buttons">
      <button class="saveButton" mat-raised-button (click)="editClick()" matTooltip="Rule settings">
        <mat-icon>tune</mat-icon>
        <span>Edit</span>
      </button>

      <button class="saveButton" mat-raised-button [matMenuTriggerFor]="moveMenu" matTooltip="Move to a function">
        <mat-icon>drive_file_move</mat-icon>
      </button>

      <mat-menu #moveMenu="matMenu">
        <button mat-menu-item
                *ngFor="let target of MoveTargets"
                (click)="MoveTo(target.id)">
          <mat-icon>folder</mat-icon>
          <span>{{target.name}}</span>
        </button>
        <button mat-menu-item *ngIf="Cage?.ruleService?.currentFunctionId" (click)="MoveOut()">
          <mat-icon>arrow_upward</mat-icon>
          <span>{{ParentName}}</span>
        </button>
        <button mat-menu-item *ngIf="!MoveTargets.length && !Cage?.ruleService?.currentFunctionId" disabled>
          <span>No function on this level</span>
        </button>
      </mat-menu>
    </div>
  </div>
