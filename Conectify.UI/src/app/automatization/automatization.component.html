<div class="page-head">
  <div class="page-title">
    <h2>Automatization</h2>
    <p class="subtitle">Create and manage automation rules</p>
  </div>

  <div class="toolbar">
    <div class="toolbar-group">
      <mat-form-field appearance="fill" subscriptSizing="dynamic" class="toolbar-field">
        <mat-label>New rule</mat-label>
        <mat-select [(ngModel)]="selectedRuleId" name="rules">
          <mat-option value=""></mat-option>
          <mat-option *ngFor="let rule of supportedRules" [value]="rule.id">
            {{rule.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-mini-fab color="primary" (click)="createRule()" matTooltip="Add rule" aria-label="Add rule">
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <span class="toolbar-divider"></span>

    <div class="toolbar-group">
      <mat-form-field appearance="fill" subscriptSizing="dynamic" class="toolbar-field">
        <mat-label>Custom input name</mat-label>
        <input matInput #inputName value="">
      </mat-form-field>

      <button mat-mini-fab color="primary" matTooltip="Add custom input" aria-label="Add custom input"
              (click)="AddCustomInput(inputName.value); inputName.value = ''">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>
</div>

<div class="connect-hint" *ngIf="source">
  <mat-icon>timeline</mat-icon>
  <span>Output picked - now click an input of the block that should receive it</span>
  <button class="link-button" (click)="CancelConnection()">Cancel</button>
</div>

<div class="example-boundary" [style.height.px]="canvasHeight">
  <p class="canvas-empty" *ngIf="!ruleService.Rules.length">
    Pick a rule above and add it to start building an automation
  </p>

  <div *ngFor="let rule of ruleService.Rules; let i = index"
       [id]="'rule-' + i"
       [style.left.px]="rule.drawingPos?.x"
       [style.top.px]="rule.drawingPos?.y"
       class="example-box"
       cdkDragBoundary=".example-boundary"
       cdkDrag
       (cdkDragEnded)="dragEnd($event, rule)"
       (cdkDragMoved)="ReDrawConnections()">
       <app-automatization-component (buttonGenerated)="handleButtonGenerated($event)" [Rule]='rule' [Cage]='this'></app-automatization-component>
  </div>
</div>
