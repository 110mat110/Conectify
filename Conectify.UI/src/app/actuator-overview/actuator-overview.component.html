<div *ngIf="actuatorIds" class="cube-grid">
  <ng-container *ngFor="let actuator of actuatorIds">
    <app-actuator-cube *ngIf="actuator.visible" [actuatorId]="actuator"></app-actuator-cube>
  </ng-container>
</div>
<div *ngIf="!actuatorIds" style="padding: 24px; color: var(--color-text-muted);">
  No actuators found.
</div>
