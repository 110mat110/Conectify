<div *ngIf="sensors" class="cube-grid">
  <ng-container *ngFor="let sensor of sensors">
    <app-sensor-cube *ngIf="sensor.visible" [sensorInput]="sensor"></app-sensor-cube>
  </ng-container>
</div>
<div *ngIf="!sensors" style="padding: 24px; color: var(--color-text-muted);">
  No sensors found.
</div>
